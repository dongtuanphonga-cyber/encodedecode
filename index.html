<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>checkra1n Verbose Log Console</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #0d0e15;
      color: #cdd6f4;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* 3D WebGL Canvas Container */
    #webgl-container {
      width: 100%;
      max-width: 650px;
      height: 200px;
      margin-bottom: 15px;
    }

    /* Console / Verbose Log Box */
    .console-box {
      width: 100%;
      max-width: 650px;
      background: #1e1e2e;
      border: 2px solid #313244;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    /* Console Header */
    .console-header {
      background: #181825;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #313244;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-close { background-color: #f38ba8; }
    .dot-min { background-color: #f9e2af; }
    .dot-max { background-color: #a6e3a1; }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: bold;
      color: #cdd6f4;
    }

    /* SVG logo checkra1n trong Header */
    .checkra1n-svg {
      width: 16px;
      height: 16px;
      fill: #89b4fa;
    }

    /* Console Body Log Content */
    .console-body {
      padding: 15px;
      font-size: 13px;
      line-height: 1.6;
    }

    .log-line {
      margin-bottom: 6px;
      word-break: break-word;
    }

    .tag-info { color: #a6e3a1; font-weight: bold; }
    .tag-verbose { color: #89b4fa; font-weight: bold; }
    .tag-warn { color: #f9e2af; font-weight: bold; }
    .tag-debug { color: #cba6f7; font-weight: bold; }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background-color: #89b4fa;
      vertical-align: middle;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Khu vực hiển thị biểu tượng 3D checkra1n bằng WebGL -->
  <div id="webgl-container"></div>

  <!-- Khu vực hiển thị Màn hình Verbose Log với Logo checkra1n SVG -->
  <div class="console-box">
    <div class="console-header">
      <div class="window-controls">
        <span class="dot dot-close"></span>
        <span class="dot dot-min"></span>
        <span class="dot dot-max"></span>
      </div>
      <div class="header-title">
        <!-- SVG Logo checkra1n (Quân cờ Vua) -->
        <svg class="checkra1n-svg" viewBox="0 0 20 25" xmlns="http://www.w3.org/2000/svg">
          <path d="M 2,12 L 5,2 L 10,8 L 15,2 L 18,12 Z"/>
          <rect x="5" y="13" width="10" height="8" rx="1"/>
          <rect x="2" y="22" width="16" height="3" rx="1"/>
        </svg>
        <span>checkra1n verbose log</span>
      </div>
    </div>

    <div class="console-body">
      <div class="log-line"><span class="tag-info">[INFO]</span> Booting checkra1n environment...</div>
      <div class="log-line"><span class="tag-verbose">[VERBOSE]</span> DFU Device connected in recovery mode.</div>
      <div class="log-line"><span class="tag-verbose">[VERBOSE]</span> Rendering checkra1n 3D asset via WebGL.</div>
      <div class="log-line"><span class="tag-warn">[WARN]</span> Heap memory allocation set to 65% capacity.</div>
      <div class="log-line"><span class="tag-debug">[DEBUG]</span> WebAudio context initialized on channel 0.</div>
      <div class="log-line">
        <span class="tag-info">&gt;</span> <span id="typed-text">Executing exploit chain...</span> <span class="cursor"></span>
      </div>
    </div>
  </div>

  <!-- Nạp thư viện Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // 1. Khởi tạo WebGL Scene
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // 2. Tạo hình khối Logo 3D checkra1n
    const checkra1nGroup = new THREE.Group();

    const mat = new THREE.MeshStandardMaterial({
      color: 0x89b4fa,
      wireframe: true,
      emissive: 0x111827
    });

    // Thân quân cờ
    const baseGeo = new THREE.CylinderGeometry(0.6, 0.8, 0.8, 8);
    const baseMesh = new THREE.Mesh(baseGeo, mat);
    baseMesh.position.y = -0.4;
    checkra1nGroup.add(baseMesh);

    // Đầu vương miện checkra1n
    const crownGeo = new THREE.ConeGeometry(0.9, 0.8, 5, 1, true);
    const crownMesh = new THREE.Mesh(crownGeo, mat);
    crownMesh.position.y = 0.4;
    crownMesh.rotation.x = Math.PI;
    checkra1nGroup.add(crownMesh);

    scene.add(checkra1nGroup);

    // 3. Thiết lập Ánh sáng
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x89b4fa, 1.2);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    // 4. Vòng lặp Render / Animation
    function animate() {
      requestAnimationFrame(animate);
      checkra1nGroup.rotation.y += 0.015;
      renderer.render(scene, camera);
    }
    animate();

    // Tự động căn chỉnh lại kích thước khi thay đổi màn hình
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
